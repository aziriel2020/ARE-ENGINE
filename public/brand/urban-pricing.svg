<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07090D"/>
      <stop offset="1" stop-color="#040507"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#C8FF00" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#45D8FF" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(990 330) rotate(90) scale(420 760)">
      <stop offset="0" stop-color="#C8FF00" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#45D8FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurBig"><feGaussianBlur stdDeviation="46"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Urban skyline -->
  <g opacity="0.7">
    <rect x="80" y="520" width="110" height="430" fill="#0E1118"/>
