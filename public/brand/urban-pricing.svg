    <rect x="330" y="560" width="150" height="390" fill="#0B0E13"/>
    <rect x="510" y="420" width="120" height="530" fill="#0E1219"/>
    <rect x="650" y="500" width="170" height="450" fill="#0A0D12"/>
    <rect x="860" y="440" width="130" height="510" fill="#0D1017"/>
    <rect x="1020" y="390" width="160" height="560" fill="#0E1218"/>
    <rect x="1205" y="470" width="110" height="480" fill="#0A0D12"/>
    <rect x="1330" y="430" width="180" height="520" fill="#0E1117"/>
    <rect x="1540" y="550" width="120" height="400" fill="#0A0D11"/>
    <rect x="1690" y="460" width="150" height="490" fill="#0D1016"/>
  </g>

  <!-- Windows -->
  <g opacity="0.28" fill="#D9F77A">
    <rect x="100" y="560" width="6" height="10"/><rect x="112" y="560" width="6" height="10"/><rect x="100" y="580" width="6" height="10"/>
    <rect x="236" y="520" width="6" height="10"/><rect x="248" y="520" width="6" height="10"/><rect x="260" y="540" width="6" height="10"/>
    <rect x="530" y="470" width="6" height="10"/><rect x="542" y="490" width="6" height="10"/><rect x="554" y="530" width="6" height="10"/>
    <rect x="872" y="480" width="6" height="10"/><rect x="884" y="500" width="6" height="10"/><rect x="896" y="540" width="6" height="10"/>
    <rect x="1045" y="430" width="6" height="10"/><rect x="1057" y="450" width="6" height="10"/><rect x="1069" y="490" width="6" height="10"/>
    <rect x="1360" y="480" width="6" height="10"/><rect x="1372" y="500" width="6" height="10"/><rect x="1384" y="540" width="6" height="10"/>
    <rect x="1720" y="510" width="6" height="10"/><rect x="1732" y="530" width="6" height="10"/><rect x="1744" y="560" width="6" height="10"/>
  </g>

  <!-- Music waveform skyline -->
  <path d="M0 760C120 710 220 860 340 790C460 720 560 860 680 790C800 720 900 860 1020 780C1140 700 1240 860 1360 790C1480 720 1600 850 1720 790C1820 740 1880 760 1920 770" stroke="url(#neon)" stroke-width="3"/>
  <path d="M0 810C120 760 220 900 340 835C460 770 560 900 680 835C800 770 900 900 1020 825C1140 750 1240 900 1360 835C1480 770 1600 890 1720 835C1820 790 1880 805 1920 815" stroke="url(#neon)" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Light streaks -->
  <g filter="url(#blurBig)" opacity="0.4">
    <ellipse cx="1040" cy="260" rx="180" ry="70" fill="#C8FF00"/>
    <ellipse cx="1280" cy="330" rx="150" ry="60" fill="#45D8FF"/>
  </g>
