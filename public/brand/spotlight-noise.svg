<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="spot" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 420) rotate(90) scale(420 760)">
      <stop offset="0" stop-color="#C8FF00" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#6AE6FF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.015"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#07090B"/>
  <rect width="1600" height="900" fill="url(#spot)"/>
  <rect width="1600" height="900" filter="url(#noise)"/>
</svg>
